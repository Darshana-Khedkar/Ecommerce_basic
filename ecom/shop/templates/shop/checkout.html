<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>My Website</title>
</head>
<body>

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h2>Checkout</h2>
            <p>Review your cart items before proceeding.</p>
            <ul class="list-group mb-3" id="cart-items"></ul> <!-- Cart items will be added here -->
            <ul class="list-group mb-3" id="cart-items-price"></ul> <!-- Cart items will be added here -->
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <form method="POST">
                {% csrf_token%}
                <input type="hidden" id="items" name="items">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="inputEmail4">Name</label>
                        <input id="name" name="name" type="text" class="form-control" id="inputEmail4"
                               placeholder="john">
                    </div>
                    <div class="form-group col-md-6">
                        <label for="inputPassword4">Email</label>
                        <input id="email" name="email" type="text" class="form-control" id="inputPassword4"
                               placeholder="john@gmail.com">
                    </div>
                </div>
                <div class="form-group">
                    <label for="inputAddress">Address</label>
                    <input id="address" name="address" type="text" class="form-control" id="inputAddress"
                           placeholder="1234 Main St">
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="inputCity">City</label>
                        <input id="city" name="city" type="text" class="form-control" id="inputCity">
                    </div>
                    <div class="form-group col-md-4">
                        <label for="inputState">State</label>
                        <input id="state" name="state" type="text" class="form-control" id="inputState">
                    </div>
                    <div class="form-group col-md-2">
                        <label for="inputZip">Zip</label>
                        <input id="zipcode" name="zipcode" type="text" class="form-control" id="inputZip">
                    </div>
                    <div class="form-group col-md-2">
                        <label for="inputZip">Amount to be paid</label>
                        <input readonly="" type="text" class="form-control" id="totalPrice" name="totalPrice">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="place-order-btn">Place Order</button>
            </form>

        </div>

    </div>


</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        let cartData = localStorage.getItem("cart");

        if (cartData) {
            try {
                let cart = JSON.parse(cartData);
                let cartList = document.getElementById("cart-items");
                let cartListPrice = document.getElementById("cart-items-price");
                let totalPrice = 0;

                // Loop through each item in the cart and add it to the list
                for (let item in cart) {
                    let li = document.createElement("li");
                    li.className = "list-group-item d-flex justify-content-between align-items-center";
                    li.innerHTML = `
                        ${cart[item].name}
                        <span class="fw-bold">Qty: ${cart[item].quantity}</span>
                    `;

                    cartList.appendChild(li);
                    totalPrice += cart[item].totalPrice;

                }
                let li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center";
                li.innerHTML = `
                        <strong>Total Cart Price</strong>
                        <span class="fw-bold">${totalPrice}</span>

                    `;
                cartListPrice.appendChild(li);
                // **Update the total price input field**
                document.getElementById("totalPrice").value = totalPrice; // Vanilla JS version
                $('#totalPrice').val(totalPrice); // jQuery version
            } catch (error) {
                console.error("Error parsing cart data:", error);
            }
        } else {
            document.getElementById("cart-items").innerHTML = "<li class='list-group-item'>Your cart is empty</li>";
        }
    });

    // Handle Place Order Button Click
    /*document.getElementById("place-order-btn").addEventListener("click", function () {
        console.warn("")
        alert("Order placed successfully!");
        localStorage.removeItem("cart"); // Clear cart after order
        window.location.href = "/"; // Redirect to home page
    });*/
    document.getElementById("place-order-btn").addEventListener("click", function () {
        let cartData = localStorage.getItem("cart");

        if (cartData) {
            document.getElementById("items").value = cartData;
        }

        alert("Order placed successfully!");
        localStorage.removeItem("cart"); // Clear cart after order
        window.location.href = "/"; // Redirect to home page
    });


</script>

{% endblock %}

</body>
</html>
